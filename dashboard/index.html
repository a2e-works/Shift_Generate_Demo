const _memoryStore = {};

  async get(key, shared) {
    const fullKey = "a2e_" + key;
    if (!(fullKey in _memoryStore)) {

  async set(key, value, shared) {
    _memoryStore["a2e_" + key] = value;

  },

function shiftFor(memberId, dateStr) {
  const member = DATA.members.find((m) => m.id === memberId);
  const day = DATA.team_shifts_by_date.find((d) => d.date === dateStr);
  if (!member || !day) return null;
  return day.shifts[member.team];
}

// ---- 希望休の自動承認ロジック(src/auto_approval.py と同じ考え方をJS側でも再現) ----
const HOURS_BY_SHIFT = { "早番A": 8, "早番B": 8, "夜勤": 16, "明け": 0, "休み": 0 };

function getISOWeekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  const dayNum = (d.getUTCDay() + 6) % 7; // 月曜=0
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const diff = (d - firstThursday) / 86400000;
  const week = 1 + Math.round(diff / 7);
  return `${d.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
}

function weeklyHoursForTeam(team, weekKey) {
  let total = 0;
  for (const day of DATA.team_shifts_by_date) {
    if (getISOWeekKey(day.date) === weekKey) {
      total += HOURS_BY_SHIFT[day.shifts[team]] || 0;
    }
  }
  return total;
}

function teamCapableHeadcount(team) {
  return DATA.members.filter((m) => m.team === team && m.capable).length;
}

function checkNgPairPartner(memberId) {
  for (const pair of AUTO_APPROVAL.ng_pairs || []) {
    if (pair.includes(memberId)) {
      const otherId = pair.find((id) => id !== memberId);
      const other = DATA.members.find((m) => m.id === otherId);
      if (other) return other.name;
    }
  }
  return null;
}

function isNgPair(idA, idB) {
  return (AUTO_APPROVAL.ng_pairs || []).some((pair) => pair.includes(idA) && pair.includes(idB));
}

function teamShiftOn(team, dateStr) {
  const day = DATA.team_shifts_by_date.find((d) => d.date === dateStr);
  return day ? day.shifts[team] : null;
}

// ---- 交代要員(振替)の提案ロジック(src/substitution.py と同じ考え方) ----
function findSubstituteCandidates(dateStr, team, absentMemberId, maxCandidates = 3) {
  const day = DATA.team_shifts_by_date.find((d) => d.date === dateStr);
  if (!day) return [];
  const teamMembersToday = DATA.members.filter((m) => m.team === team && m.id !== absentMemberId);

  const candidates = [];
  for (const m of DATA.members) {
    if (m.team === team) continue; // 同じチームは元々出勤予定なので対象外
    const theirShift = day.shifts[m.team];
    if (theirShift !== "休み" && theirShift !== "明け") continue; // 元々空いている人だけが対象
    const ngConflict = teamMembersToday.some((other) => isNgPair(m.id, other.id));
    candidates.push({ memberId: m.id, name: m.name, team: m.team, role: m.role, capable: m.capable, ngConflict });
  }
  candidates.sort((a, b) => Number(a.ngConflict) - Number(b.ngConflict) || Number(b.capable) - Number(a.capable));
  return candidates.slice(0, maxCandidates);
}

function simulateSubstitution(dateStr, team, absentMemberId) {
  const shift = teamShiftOn(team, dateStr);
  const required = REQUIRED_HEADCOUNT[shift] || 0;
  const teamSizeToday = DATA.members.filter((m) => m.team === team).length;
  const scheduledAfterLeave = teamSizeToday - 1;
  const meets = scheduledAfterLeave >= required;
  const absentMember = DATA.members.find((m) => m.id === absentMemberId);

  if (required === 0) {
    return { shift, required, scheduledAfterLeave, needsSubstitute: false, message: `${shift}は必要人数の定めがないため、交代なしで承認可能` };
  }
  if (meets) {
    return { shift, required, scheduledAfterLeave, needsSubstitute: false, message: `チーム内に${scheduledAfterLeave}名残るため、交代なしで必要人数(${required}名)を満たす` };
  }

  const candidates = findSubstituteCandidates(dateStr, team, absentMemberId);
  const usable = candidates.filter((c) => !c.ngConflict);
  if (usable.length > 0) {
    const best = usable[0];
    const day = DATA.team_shifts_by_date.find((d) => d.date === dateStr);
    const bestOriginalShift = day.shifts[best.team];
    return {
      shift,
      required,
      scheduledAfterLeave,
      needsSubstitute: true,
      swapOut: absentMember.name,
      swapIn: best.name,
      swapInTeam: best.team,
      message: `${absentMember.name}(チーム${team})の代わりに、${best.name}(チーム${best.team}、この日は元々${bestOriginalShift})を配置すれば必要人数を維持できる`,
    };
  }
  return {
    shift,
    required,
    scheduledAfterLeave,
    needsSubstitute: true,
    swapOut: absentMember.name,
    swapIn: null,
    message: `交代できる候補が見つからない。必要人数${required}名に対し${scheduledAfterLeave}名までしか維持できない見込み`,
  };
}

function evaluateAutoApproval(memberId, requestDateStr, submittedDateStr, enabledOverride) {
  const settings = AUTO_APPROVAL.settings;
  const enabled = enabledOverride === undefined ? settings.enabled : enabledOverride;
  if (!enabled) {
    return { autoApproved: false, reasons: ["管理者設定により自動承認機能がOFFになっている"] };
  }
  const member = DATA.members.find((m) => m.id === memberId);
  const reasons = [];

  const daysBefore = Math.round((new Date(requestDateStr) - new Date(submittedDateStr)) / 86400000);
  if (daysBefore < settings.min_days_before) {
    reasons.push(`申請期限(${settings.min_days_before}日前まで)を満たしていない(実際: ${daysBefore}日前)`);
  }

  // 早番Aは通常の運行に必須な枠ではない(教育投資枠)。休んでも運行上の穴は生じないため、
  // 週40時間・必要人数のチェックは対象外とする。
  const requestedShift = shiftFor(memberId, requestDateStr);
  const isEarlyA = requestedShift === "早番A";
  let substitution = null;

  if (!isEarlyA) {
    const weekKey = getISOWeekKey(requestDateStr);
    const teamHours = weeklyHoursForTeam(member.team, weekKey);
    if (teamHours > 40) {
      const teamNames = DATA.members
        .filter((m) => m.team === member.team)
        .map((m) => m.name)
        .join("、");
      reasons.push(`週40時間の労働時間超過がチーム内に存在するため、健全度に関係なく手動確認が必要(${teamNames})`);
    }

    substitution = simulateSubstitution(requestDateStr, member.team, memberId);
    if (substitution.needsSubstitute && !substitution.swapIn) {
      reasons.push(`必要人数(${substitution.required}名)を満たす交代要員が見つからない(${substitution.message})`);
    }
  }

  const ngPartner = checkNgPairPartner(memberId);
  if (ngPartner) {
    reasons.push(`${ngPartner}とのNGペア調整が絡むため当事者間の確認が必要`);
  }

  const autoApproved = reasons.length === 0;
  if (autoApproved) {
    if (isEarlyA) {
      reasons.push("早番A(教育投資枠)の希望休のため、運行への影響なし → 自動承認");
    } else if (substitution && substitution.swapIn) {
      reasons.push(
        `申請期限・週40時間・NGペアは問題なし。${substitution.swapIn}(チーム${substitution.swapInTeam})が交代要員として配置可能なため → 自動承認`
      );
    } else {
      reasons.push("申請期限・週40時間・必要人数・NGペアのいずれも問題なし → 自動承認");
    }
  }
  return { autoApproved, reasons, isEarlyA, substitution };
}

// ---- カレンダーの各日に表示する「休みやすさ」の目安スコア(0-100) ----
// 早番Aは常に高スコア。早番B・夜勤は実際に交代要員が見つかるかをシミュレーションして算出する。
// 休み/明けの日は元々出勤していないため計算不要(nullを返す)。
function dayScore(memberId, dateStr) {
  const shift = shiftFor(memberId, dateStr);
  if (shift === "休み" || shift === "明け" || !shift) return null;
  if (shift === "早番A") return 95;
  const member = DATA.members.find((m) => m.id === memberId);
  const sub = simulateSubstitution(dateStr, member.team, memberId);
  if (!sub.needsSubstitute) return 95;
  if (sub.swapIn) return 85;
  return Math.round((sub.scheduledAfterLeave / sub.required) * 100);
}

function healthColor(score) {
  if (score >= 80) return "#34d399"; // emerald-400
  if (score >= 60) return "#fbbf24"; // amber-400
  return "#f87171"; // red-400
}

function HealthGauge({ value }) {
  const radius = 52;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference * (1 - value / 100);
  const color = healthColor(value);
  return (
    <div className="relative w-32 h-32 shrink-0">
      <svg width="128" height="128" viewBox="0 0 128 128">
        <circle cx="64" cy="64" r={radius} strokeWidth="10" stroke="#1e293b" fill="none" />
        <circle
          cx="64"
          cy="64"
          r={radius}
          strokeWidth="10"
          stroke={color}
          fill="none"
          strokeDasharray={circumference}
          strokeDashoffset={offset}
          strokeLinecap="round"
          transform="rotate(-90 64 64)"
          style={{ transition: "stroke-dashoffset 0.6s ease" }}
        />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className="font-mono text-2xl font-semibold text-slate-100">{value.toFixed(1)}</span>
        <span className="text-[10px] tracking-widest text-slate-500 uppercase">Health</span>
      </div>
    </div>
  );
}

function MetricBar({ label, value }) {
  const color = healthColor(value);
  return (
    <div>
      <div className="flex items-baseline justify-between mb-1">
        <span className="text-xs text-slate-400 tracking-wide">{label}</span>
        <span className="font-mono text-sm text-slate-200">{value.toFixed(1)}</span>
      </div>
      <div className="h-1.5 rounded-full bg-slate-800 overflow-hidden">
        <div className="h-full rounded-full" style={{ width: `${value}%`, backgroundColor: color }} />
      </div>
    </div>
  );
}

function MonthCalendar({ memberId, onPickDate }) {
  const cells = useMemo(() => {
    const days = DATA.team_shifts_by_date.map((d) => d.date);
    const firstDow = new Date(days[0] + "T00:00:00Z").getUTCDay(); // 0=Sun
    const blanks = Array.from({ length: firstDow }, () => null);
    return [...blanks, ...days];
  }, []);

  return (
    <div>
      <div className="grid grid-cols-7 gap-1 mb-1">
        {["日", "月", "火", "水", "木", "金", "土"].map((w) => (
          <div key={w} className="text-center text-[10px] text-slate-500 tracking-widest">
            {w}
          </div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-1">
        {cells.map((dateStr, i) => {
          if (!dateStr) return <div key={`b${i}`} />;
          const shift = shiftFor(memberId, dateStr);
          const meta = SHIFT_META[shift] || {};
          const dayNum = parseInt(dateStr.slice(-2), 10);
          const score = dayScore(memberId, dateStr);
          return (
            <button
              key={dateStr}
              onClick={() => onPickDate(dateStr)}
              className={`aspect-square rounded-md border text-left p-1 flex flex-col justify-between hover:brightness-125 transition ${meta.chip || "bg-slate-800 border-slate-700"}`}
            >
              <span className="text-[10px] font-mono text-slate-300">{dayNum}</span>
              <span className="text-xs font-bold text-center leading-none">{meta.abbr || "-"}</span>
              <span
                className="text-[9px] font-mono text-right leading-none"
                style={score !== null ? { color: healthColor(score) } : { visibility: "hidden" }}
              >
                {score !== null ? score : "00"}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

      } catch (e) {
        // 初回アクセス: 既存の希望休データを申請の初期状態としてシードする
        const seed = [];
        Object.entries(DATA.requested_days_off).forEach(([mid, dates]) => {

            const autoApproved = preComputed ? preComputed.auto_approved : false;

              member_id: mid,
              date,
              reason: "(初期データ)",
              status: autoApproved ? "approved" : "pending",
              auto_approved: autoApproved,
              auto_reasons: reasons,
              created_at: new Date().toISOString(),

        });

          await storage.set(STORAGE_KEY, JSON.stringify(seed), true);

        setRequests(seed);
      } finally {
        setLoading(false);
      }
    })();

    setRequests(next);

              (チーム×設備)。このままだと、該当箇所の教育達成率はこれ以上伸びません。
            </p>
            <div className="flex flex-wrap gap-1.5">
              {FUTURE_DATA.gaps_with_options.map((g) => (
                <span
                  key={`${g.team}-${g.equipment}`}
                  className="text-[11px] px-2 py-1 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/30"
                >
                  チーム{g.team} / {g.equipment}
                </span>
              ))}
            </div>
            <p className="text-[11px] text-slate-500 mt-3 leading-relaxed">
              具体的にどう改善すべきか(誰をどう配置・育成するか)は、組織の事情(人間関係・
              コスト・スピード優先度等)を踏まえて個別にご提案しています。ご興味があれば
              お問い合わせください。
            </p>
          </div>

          {resolvedRequests.length > 0 && (
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
              <div className="text-sm font-semibold text-slate-200 mb-3">対応済みの希望休</div>
              <div className="space-y-1.5">
                {resolvedRequests.map((r) => {
                  const member = membersById[r.member_id];
                  const status = STATUS_META[r.status];
                  const StatusIcon = status.Icon;
                  return (
                    <div key={r.id} className="flex items-center justify-between text-sm">
                      <span className="text-slate-400">
                        {member?.name} / {r.date}
                      </span>
                      <span className={`text-[11px] px-2 py-1 rounded-full border flex items-center gap-1 ${status.cls}`}>
                        <StatusIcon size={12} /> {status.label}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </main>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ShiftDashboard />);
</script>
</body>
</html>
